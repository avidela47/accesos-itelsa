<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#061a33" />

  <title>ITELSA SAS | Accesos</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="page-shell">

    <header class="topbar">
      <a class="brand" href="#" aria-label="ITELSA">
        <img src="itelsa-logo.png" alt="ITELSA" />
      </a>
    </header>

    <main class="lobby">
      <div class="ambient-logo ambient-logo--left"></div>
      <div class="ambient-wordmark">ITELSA</div>

      <section class="access-map" id="accessMap" aria-label="Lobby central de accesos">

        <div class="orbit" aria-hidden="true"></div>

        <a class="portal portal--smart" href="https://gestion-luminarias.vercel.app" target="_blank" rel="noopener">
          <span class="portal-ring">
            <img src="itelsa-icon.png" alt="" />
          </span>
          <span class="portal-name">Smart<br>Lighting</span>
        </a>

        <a class="portal portal--sas" href="https://itelsasas.com" target="_blank" rel="noopener">
          <span class="portal-ring">
            <img src="itelsa-icon.png" alt="" />
          </span>
          <span class="portal-name">Itelsa<br>SAS</span>
        </a>

        <a class="portal portal--relevamiento" href="https://relevamiento-pied.vercel.app" target="_blank" rel="noopener">
          <span class="portal-ring">
            <img src="itelsa-icon.png" alt="" />
          </span>
          <span class="portal-name">Relevamiento</span>
        </a>

        <a class="portal portal--despachos" href="https://avidela47.github.io/etiquetas/" target="_blank" rel="noopener">
          <span class="portal-ring">
            <img src="itelsa-icon.png" alt="" />
          </span>
          <span class="portal-name">Despachos</span>
        </a>

        <a class="portal portal--engineering" href="https://itelsa-engineering.vercel.app" target="_blank" rel="noopener">
          <span class="portal-ring">
            <img src="itelsa-icon.png" alt="" />
          </span>
          <span class="portal-name">Engineering</span>
        </a>

        <a class="portal portal--matriz" href="https://medicion-de-matriz-88puntos.vercel.app" target="_blank" rel="noopener">
          <span class="portal-ring">
            <img src="itelsa-icon.png" alt="" />
          </span>
          <span class="portal-name">Matriz<br>88 Puntos</span>
        </a>

        <div class="hub">
          <div class="hub-kicker">ACCESOS</div>
          <div class="hub-subtitle">CENTRO DE CONEXIÓN</div>

          <div class="hub-stage">
            <div class="hub-halo hub-halo--1"></div>
            <div class="hub-halo hub-halo--2"></div>

            <div class="hub-core">
              <img src="itelsa-icon.png" alt="ITELSA" />
              <span>ITELSA</span>
            </div>

            <div class="hub-panel hub-panel--tl">
              <span class="panel-icon">◈</span>
              <i></i><i></i>
            </div>
            <div class="hub-panel hub-panel--tr">
              <span class="panel-icon">●</span>
              <i></i><i></i>
            </div>
            <div class="hub-panel hub-panel--ml">
              <span class="panel-icon">⌁</span>
              <i></i><i></i>
            </div>
            <div class="hub-panel hub-panel--mr">
              <span class="panel-icon">◎</span>
              <i></i><i></i>
            </div>
            <div class="hub-panel hub-panel--bl">
              <span class="panel-icon">⌘</span>
              <i></i><i></i>
            </div>
            <div class="hub-panel hub-panel--br">
              <span class="panel-icon">◇</span>
              <i></i><i></i>
            </div>

            <div class="hub-base">
              <span></span>
            </div>
          </div>

          <p class="hub-copy">Un punto. Todas las conexiones.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
